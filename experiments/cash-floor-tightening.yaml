# 3-arm A/B: does tightening or loosening the drift filter + rebalance
# bands change outcomes? Same news + same market data flow to all arms;
# only the config diff distinguishes them.
name: cash-floor-tightening
arms:
  A:
    alpaca_account: primary
    # baseline: profile defaults
    config_diff: {}
  B:
    alpaca_account: secondary
    # treatment: tighter drift + smaller bands (more sensitive)
    config_diff:
      opinion_drift_threshold_pct: 3
      band_abs_pct: 3
  C:
    alpaca_account: tertiary
    # treatment: looser drift + bigger bands (less sensitive)
    config_diff:
      opinion_drift_threshold_pct: 7
      band_abs_pct: 7
