# reasoning-quality: 3-arm A/B on Alpaca paper accounts.
#
# Sept 14-18 ran the M14.5 shape (cooldown vs cite-to-trade vs
# ensemble-on-cite). That series closed Fri 09-18 with all three arms
# net-negative for the week (A -$70, B -$75, C -$168). See B14 for
# the postmortem.
#
# Week 2 (Sept 22+) pivots the same three accounts to orthogonal Jev
# integrations without changing account routing. Each arm now tests
# exactly one Jev insertion point so the comparison stays clean:
#
#   A -> pure baseline (control). NO Jev, cite-to-trade off.
#        Answers: does Jev help ANYWHERE vs the plain gpt-4o-mini
#        stack we've been running?
#
#   B -> Jev VERDICT-FEEDBACK on. cite-to-trade off (so the effect
#        we measure is self-attribution, not gate stacking). Whipsaw
#        guard on. Uses the new '## 12. Recent decision verdicts'
#        prompt block backed by jev_client.verdict_for_trade.
#
#   C -> Jev MATERIALITY on. Replaces the finBERT+ticker-overlap
#        prefilter with jev_client.materiality_check. Keeps
#        cite-to-trade on (so we can isolate what the cheaper +
#        typed materiality gate does vs the current ~$2.80/day
#        cost profile). Whipsaw guard on.
#
# Shared across arms:
#   - pre-market lead 30 min (--pre-market-lead-min 30 on launch)
#   - AGENTIC_MEM_RECYCLE_MB=6144 (supervisor sets this)
#   - all price/news bus + ml-service infra identical
#
# NOT changed this week:
#   - No new Alpaca account (arm D deferred). Same 3-account layout.
#   - No new experiment (extends this manifest in place).
#   - No mid-week config changes; freeze until Fri 2026-09-26 close.
name: reasoning-quality
arms:
  A:  # Pure baseline / control. No Jev anywhere, no whipsaw guard,
      # cite-to-trade off. Same shape A ran last week.
    alpaca_account: primary
    config_diff:
      cooldown_seconds: 1500          # keep the 25min flip lockout
    env:
      AGENTIC_CITE_TO_TRADE: "0"
      AGENTIC_JEV_VERDICT_ENABLED: "0"
      AGENTIC_JEV_MATERIALITY_ENABLED: "0"
      AGENTIC_WHIPSAW_GUARD_WINDOW_MIN: "0"

  B:  # Jev verdict-feedback in the prompt tail. Tests whether the
      # LLM adapts when it sees its own recent trade outcomes.
      # cite-to-trade OFF so the observed effect is attributable to
      # the verdict block, not gate stacking.
    alpaca_account: secondary
    config_diff: {}
    env:
      AGENTIC_CITE_TO_TRADE: "0"
      AGENTIC_JEV_VERDICT_ENABLED: "1"
      AGENTIC_JEV_MATERIALITY_ENABLED: "0"
      AGENTIC_WHIPSAW_GUARD_WINDOW_MIN: "15"

  C:  # Jev materiality gate replaces the finBERT+ticker-overlap
      # prefilter. cite-to-trade left ON so we can measure the
      # cost delta apples-to-apples with last week's C. Expected
      # ~65% cost reduction on materiality-gate calls (Jev at
      # $0.042/M in vs gpt-4o-mini at $0.15/M in + $0.60/M out).
    alpaca_account: tertiary
    config_diff: {}
    env:
      AGENTIC_JEV_VERDICT_ENABLED: "0"
      AGENTIC_JEV_MATERIALITY_ENABLED: "1"
      AGENTIC_WHIPSAW_GUARD_WINDOW_MIN: "15"
