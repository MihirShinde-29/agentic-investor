# M14.5 (Sept 15+): three-arm A/B testing two variables at once:
#
#   1. Trade gate: wall-clock cooldown (A) vs cite-to-trade (B, C)
#   2. Model stack: single call (A, B) vs cross-family ensemble (C)
#
# Each arm differs from at least one other by exactly ONE variable so we
# can attribute causally:
#
#   A vs B  -> did replacing cooldown with cite-to-trade help? (same
#              model, only the gate differs)
#   B vs C  -> does cross-family ensemble help ON TOP of cite-to-trade?
#              (same gate, only the model stack differs)
#   A vs C  -> combined effect (2 things differ; less clean but still
#              interesting for the overall shipping decision)
#
# Shared across all three arms (feature toggles, not experimental):
#   - pre-market lead 30 min (--pre-market-lead-min 30 on launch)
#   - confidence field emitted on every rec (M15 calibration data)
#   - all other loop config identical
#
# Prior week (Sept 9-11) ran a different reasoning-quality design; this
# YAML supersedes it. Deleted old cross-tier config since M14 already
# validated within-family ensemble under-earned at 3.5x cost.
name: reasoning-quality
arms:
  A:  # old-world reference - restores the wall-clock cooldown we
      # deleted this weekend. Answers "was deleting cooldown a mistake?"
    alpaca_account: primary
    config_diff:
      cooldown_seconds: 1500          # 25min per-ticker flip lockout
    env:
      AGENTIC_CITE_TO_TRADE: "0"      # disable new gate for A only

  B:  # current world - cite-to-trade alone, single LLM call. This is
      # what we shipped this weekend, isolated.
    alpaca_account: secondary
    config_diff: {}

  C:  # M14 upside - cross-family ensemble on top of cite-to-trade.
      # Tests whether two independently-trained models agree in a way
      # that beats single-call at ~2x cost.
    alpaca_account: tertiary
    config_diff: {}
    env:
      # FROZEN through 2026-09-19 (Fri close). Day-2 analysis showed C
      # is the only arm making money on drift-thrashed names via the
      # ensemble's filter-inversion mechanic. The Anthropic cost is
      # ~$5/day but the finding is worth the $15-20 through Friday.
      # Cheap-model swap deferred to arm D (Mon 2026-09-22 launch).
      AGENTIC_ENSEMBLE_MODELS: "gpt-4o-mini,anthropic/claude-haiku-4-5"
