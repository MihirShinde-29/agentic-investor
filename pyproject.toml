[project]
name = "agentic-investor"
version = "0.1.0"
description = "Multi-agent LLM investment research assistant (paper/backtest only)"
readme = "README.md"
authors = [
    { name = "MihirShinde-29", email = "mihirushinde29@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "fastapi>=0.115.0",
    "instructor>=1.15.4",
    "langfuse>=2.60.0",
    "langgraph>=1.2.11",
    "litellm>=1.96.2",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.0",
    # sqlite-vec backs both the M17 rec store (#144) and the news store
    # (#146) after chromadb was retired for HNSW-corruption fragility.
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.32.0",
    "yfinance>=1.6.0",
]

[project.scripts]
agentic-investor = "agentic_investor.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    # Test coverage for the Jev integration paths (see llm/jev_client.py)
    # needs `Choice` / `Noul` importable so the mocked-client tests don't
    # trip the wrapper's try/except and silently fall back. Dev-only;
    # runtime behaviour is unchanged and the optional `jev` group is
    # still the "you're actually going to call Jev at runtime" install.
    "typesafe-sdk>=0.1.0",
]
# Optional: TypeSafe AI's Jev System-One model. Used for the
# per-arm feature-flagged verdict-labels + materiality-gate paths
# (see AGENTIC_JEV_* flags). A fresh clone without the group still
# installs cleanly; anything that touches jev_client falls back to
# the deterministic path when the SDK isn't importable.
jev = [
    "typesafe-sdk>=0.1.0",
]

[tool.uv]
# Project and uv cache live on different drives (D: vs C:), so hardlinking
# isn't possible; copy instead and silence the warning.
link-mode = "copy"

[tool.ruff]
# Keep line length generous; agents/prompts get wide.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort (import sorting), UP = pyupgrade,
# B = bugbear (likely-bug patterns). A pragmatic, widely-used default set.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# One-off analysis / reporting scripts have wide print-tables; wrapping every
# f-string just to satisfy the 100-col limit hurts readability. Application
# code under src/ still gets the full rule set.
"scripts/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
