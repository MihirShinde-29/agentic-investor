services:
  paper-loop:
    build: .
    image: agentic-investor:local
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite mirror + session artifacts across container restarts.
      - ./agentic_investor.db:/app/agentic_investor.db
      - ./out:/app/out
      - ./.chroma:/app/.chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
