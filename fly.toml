# fly.toml app configuration file generated for agentic-investor on 2026-08-31T23:49:16-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agentic-investor'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CHROMA_DIR = '/data/.chroma'
  DATABASE_URL = 'sqlite:////data/agentic_investor.db'
  DATA_DIR = '/data'

[[mounts]]
  source = 'agentic_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
